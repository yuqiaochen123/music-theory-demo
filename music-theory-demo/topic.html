  <style>

    body[data-topic="scale-degrees"] .examples{grid-template-columns:1fr;min-width:0;max-width:100%}body[data-topic="scale-degrees"] .example+.example{border-left:0;border-top:1px solid var(--line)}body[data-topic="scale-degrees"] .scale-direction{contain:inline-size;min-width:0;max-width:100%;overflow:hidden;padding:14px 24px 10px}body[data-topic="scale-degrees"] .scale-direction+.scale-direction{border-top:1px solid var(--line)}body[data-topic="scale-degrees"] .scale-direction-head{display:flex;align-items:center;justify-content:flex-start;gap:14px}body[data-topic="scale-degrees"] .direction-label{margin:0;color:var(--blue);font-size:12px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}body[data-topic="scale-degrees"] .scale-start{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:7px 12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}body[data-topic="scale-degrees"] .scale-start:hover{border-color:var(--blue);color:var(--blue)}body[data-topic="scale-degrees"] .scale-direction .notation{display:block;place-items:start;direction:ltr;width:100%;min-width:0;max-width:100%;height:190px;padding:0;overflow-x:auto;overflow-y:hidden;overflow-anchor:none;overscroll-behavior-inline:contain;scrollbar-gutter:stable;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}body[data-topic="scale-degrees"] .scale-direction .notation svg{display:block;max-width:none;height:170px;margin:0}
    body[data-topic="time-signatures"] .example-body>p{min-height:4.5em}
    body[data-topic="key-signatures"] .examples{display:block;border:0;background:transparent}body[data-topic="key-signatures"] .key-pair{margin:20px 0;border:1px solid var(--line);background:#fff}body[data-topic="key-signatures"] .key-pair-grid{display:grid;grid-template-columns:1fr 1fr}body[data-topic="key-signatures"] .key-side{min-width:0;padding:22px 24px 26px}body[data-topic="key-signatures"] .key-side+.key-side{border-left:1px solid var(--line)}body[data-topic="key-signatures"] .key-side h3{margin:5px 0 4px;font-size:28px;letter-spacing:-.035em}body[data-topic="key-signatures"] .key-side .eyebrow{margin:0;color:var(--blue)}body[data-topic="key-signatures"] .key-tonic{margin:0 0 12px;color:var(--muted);font-weight:750}body[data-topic="key-signatures"] .key-scale-notation{height:150px;display:grid;place-items:center;overflow:hidden}body[data-topic="key-signatures"] .key-scale-notation svg{display:block;max-width:100%;height:auto}body[data-topic="key-signatures"] .key-controls{display:grid;grid-template-columns:1fr;gap:9px;margin-top:16px}body[data-topic="key-signatures"] .key-controls button,body[data-topic="key-signatures"] .key-compare{border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);padding:11px;font:inherit;font-weight:800;cursor:pointer}body[data-topic="key-signatures"] .key-bridge{padding:13px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#f4f8ff;color:var(--blue);font-weight:850;text-align:center}body[data-topic="key-signatures"] .key-compare{display:block;width:calc(100% - 48px);margin:18px 24px 0;background:#ffd34e;border-color:#ffd34e;box-shadow:4px 4px 0 var(--ink)}body[data-topic="key-signatures"] .key-explanation{margin:18px 24px 0;color:#344567;font-size:16px;line-height:1.5;font-weight:650}body[data-topic="key-signatures"] .key-reference-wrap{margin:28px 0 40px}body[data-topic="key-signatures"] .key-reference-wrap h2{margin:0 0 12px;font-size:28px;letter-spacing:-.03em}body[data-topic="key-signatures"] .key-reference{overflow-x:auto;border:1px solid var(--line);background:#fff}body[data-topic="key-signatures"] .key-reference table{width:100%;min-width:620px;border-collapse:collapse}body[data-topic="key-signatures"] .key-reference th,body[data-topic="key-signatures"] .key-reference td{padding:13px 16px;border-bottom:1px solid var(--line);text-align:left}body[data-topic="key-signatures"] .key-reference tr:last-child td{border-bottom:0}body[data-topic="key-signatures"] .key-reference th{background:#f4f8ff;color:var(--blue);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
    .grouping-control{position:relative;padding:10px 24px 0}.grouping-toggle{border:1px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);padding:9px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}.grouping-toggle:hover,.grouping-toggle:focus-visible{background:#eef4ff}.grouping-options{position:absolute;z-index:5;top:100%;left:24px;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 8px 22px rgba(8,36,82,.14)}.grouping-options[hidden]{display:none}.grouping-option{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:9px 15px;font:inherit;font-weight:800;cursor:pointer}.grouping-option[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
    .play-row{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:44px 44px;gap:9px}.play-row button{border:1px solid var(--line);border-radius:4px;background:#fff;padding:9px;font-weight:750;cursor:pointer;color:var(--ink)}.play-row button:last-child{grid-column:1/-1;background:var(--ink);color:#fff;border-color:var(--ink)}
    body[data-topic="time-signatures"] .play-row{grid-template-rows:74px 54px}
    body[data-topic="time-signatures"] .play-row button[data-part="0"],body[data-topic="time-signatures"] .play-row button[data-part="1"]{min-height:74px}
    body[data-topic="time-signatures"] .play-row button[data-part="1"]{display:none}
    body[data-topic="time-signatures"] .play-row button[data-part="0"]{grid-column:1/-1}
    .continue{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:30px 0;border-top:3px solid var(--ink)}.continue h2{margin:0 0 7px}.continue p{margin:0;color:var(--muted)}.practice{background:var(--blue);color:#fff}
    @media(max-width:720px){.examples{display:block;border:0;background:transparent}.example{border:1px solid var(--line);margin-bottom:16px}.example+.example{border-left:1px solid var(--line)}body[data-topic="scale-degrees"] .example+.example{border-left:1px solid var(--line);border-top:0}body[data-topic="scale-degrees"] .scale-direction{padding-inline:8px}body[data-topic="scale-degrees"] .scale-direction .notation{height:190px}.interval-overview{display:grid;border:1px solid var(--line);grid-template-columns:1fr}.interval-link,.interval-link:nth-child(odd){border-right:0}.compare-head{align-items:start;flex-direction:column}.compare-btn{width:100%}.notation{height:175px}.grouping-control{padding-inline:18px}.grouping-toggle{width:100%}.grouping-option{flex:1 1 auto}body[data-topic="time-signatures"] .example-body>p{min-height:0}body[data-topic="key-signatures"] .key-pair-grid{grid-template-columns:1fr}body[data-topic="key-signatures"] .key-side+.key-side{border-left:0;border-top:1px solid var(--line)}body[data-topic="key-signatures"] .key-side{padding:20px 18px 22px}body[data-topic="key-signatures"] .key-compare{width:calc(100% - 36px);margin-inline:18px}body[data-topic="key-signatures"] .key-explanation{margin-inline:18px}.continue{grid-template-columns:1fr}.practice{text-align:center}.hero h1{font-size:51px}}

<body>
  <header><a class="brand" href="index.html">Listening Desk <span>♪</span></a><nav><a href="index.html">Grades</a><a href="grade-5.html">Grade 5</a></nav></header>
  <main>
    <p class="crumb"><a href="index.html">Grades</a> / <a href="grade-5.html">Grade 5</a> / <span id="crumb"></span></p>
    <section class="hero"><div class="lesson-progress-line"><p class="eyebrow" id="eyebrow"></p><span class="lesson-status" data-lesson-status data-status="not_started">Not started</span></div><h1 id="title"></h1><p class="lead" id="subtitle"></p><p class="progress-sync" data-progress-sync aria-live="polite">Loading saved progress…</p></section>
    <section class="intro"><p id="intro"></p></section>
    <section class="compare-head"><div><p class="eyebrow">Listen &amp; compare</p><h2>Hear the difference side by side.</h2></div><button class="compare-btn" id="compare">▶ Compare both</button></section>
    <section class="examples" id="examples"></section>
    <section class="continue"><div><p class="eyebrow">Ready to test yourself?</p><h2>Go to practice.</h2><p>Identify the sound using only notation and audio.</p></div><a class="practice" id="practice" href="practice.html?topic=intervals">Practise →</a></section>
  </main>
  <footer id="footer"></footer>
  <script src="vendor/vexflow-5.0.0.js"></script>
  <script src="vendor/supabase-2.111.0.js"></script>
  <script src="src/notation.js"></script>
  <script src="src/topic-data.js"></script>
  <script type="module">
    import { startCurrentLesson } from './src/progress-page.js';
    import { INTERVAL_LESSONS, getIntervalLesson } from './src/intervals.js';
    const DATA=window.ListeningDeskTopics;
    const query=new URLSearchParams(location.search);let topic=query.get('topic');if(!DATA[topic])topic='intervals';
    const lessonId=query.get('lesson');const intervalLesson=topic==='intervals'&&lessonId?getIntervalLesson(lessonId):undefined;
    const $=selector=>document.querySelector(selector);const current=()=>DATA[topic];
    const isIntervalOverview=topic==='intervals'&&!intervalLesson;
    const displayedData=()=>intervalLesson?{name:'Intervals',title:intervalLesson.label,subtitle:'See two correct spellings, hear each note, then hear the interval together.',intro:intervalLesson.intro,examples:intervalLesson.examples}:current();
    document.body.dataset.topic=topic;
    const selectedVariants={};const revealedGroupingSelectors=new Set();
    function activeExample(index){const base=displayedData().examples[index];if(!base.variants)return base;const id=selectedVariants[index]||base.variants[0].id;return {...base,...base.variants.find(variant=>variant.id===id)}}
    const audioUnavailable='Audio playback is unavailable; you can continue with notation.';
    function sound(midis,delay=0,spread=0){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){showAudioFallback();return}const audio=new Audio(),base=audio.currentTime+.03+delay;midis.forEach((midi,index)=>{const start=base+index*spread,oscillator=audio.createOscillator(),gain=audio.createGain();oscillator.type='triangle';oscillator.frequency.value=440*2**((midi-69)/12);oscillator.connect(gain).connect(audio.destination);gain.gain.setValueAtTime(.001,start);gain.gain.exponentialRampToValueAtTime(.16,start+.03);gain.gain.exponentialRampToValueAtTime(.001,start+.55);oscillator.start(start);oscillator.stop(start+.57)})}
    function showAudioFallback(){document.querySelectorAll('.play-row').forEach(row=>{if(!row.querySelector('.audio-fallback'))row.insertAdjacentHTML('beforeend',`<p class="audio-fallback">${audioUnavailable}</p>`)});document.querySelectorAll('.play-row button,[data-key-side],[data-key-compare]').forEach(button=>button.disabled=true)}
    let rhythmLoop=null;
    function stopRhythmLoop(){if(!rhythmLoop)return;clearInterval(rhythmLoop.timer);rhythmLoop.button.textContent='▶ Hear multiple bars';rhythmLoop=null}
    function toggleRhythmLoop(index,button){if(rhythmLoop?.button===button){stopRhythmLoop();return}stopRhythmLoop();const pattern=activeExample(index).parts[0][1],playBar=()=>sound(pattern,0,.22);playBar();rhythmLoop={button,timer:setInterval(playBar,pattern.length*.22*1000)};button.textContent='⏸ Pause'}
    function playPart(index,part){stopRhythmLoop();const item=activeExample(index),spread=item.audioType==='sequence'?.24:item.audioType==='rhythm'?.22:0;sound(item.parts[part][1],0,spread)}
    function playExample(index){const item=activeExample(index),parts=item.parts;if(topic==='scale-degrees'){sound(parts[0][1].concat(parts[1][1].slice(1)),0,.24)}else if(item.completeMidi){sound(item.completeMidi,0,.24)}else if(topic==='cadences'){sound(parts[0][1]);sound(parts[1][1],.9)}else if(item.audioType==='sequence'){sound(parts.flatMap(part=>part[1]),0,.24)}else if(item.audioType==='rhythm'){sound(parts[0][1],0,.22)}else sound(parts.flatMap(part=>part[1]))}
    function groupingControls(base,item,index){if(!base.variants)return'';const revealed=revealedGroupingSelectors.has(index);return `<div class="grouping-control"><button class="grouping-toggle" data-reveal-grouping="${index}" aria-expanded="${revealed}">${revealed?'Hide groupings':'Change grouping'}</button><div class="grouping-options" ${revealed?'':'hidden'}>${base.variants.map(variant=>`<button class="grouping-option" data-index="${index}" data-grouping="${variant.id}" aria-pressed="${variant.id===item.id}">${variant.id}</button>`).join('')}</div></div>`}
    function resetScaleDegreeScroll(){if(topic!=='scale-degrees')return;document.querySelectorAll('.scale-direction .notation').forEach(target=>{target.scrollLeft=0})}
    function scaleDegreeNotation(item,index){return `<div class="scale-direction"><div class="scale-direction-head"><p class="direction-label">Ascending</p><button class="scale-start" data-scale-start="notation-${index}-ascending">← Clef &amp; tonic</button></div><div class="notation" id="notation-${index}-ascending" aria-label="${item.label} ascending notation"></div></div><div class="scale-direction"><div class="scale-direction-head"><p class="direction-label">Descending</p><button class="scale-start" data-scale-start="notation-${index}-descending">← Clef &amp; tonic</button></div><div class="notation" id="notation-${index}-descending" aria-label="${item.label} descending notation"></div></div>`}
    function renderScaleDegreeNotation(item,index){const directions=[['ascending',item.notation.notes,item.notation.ascendingDegreeLabels],['descending',item.notation.descendingNotes,item.notation.descendingDegreeLabels]];directions.forEach(([direction,notes,degreeLabels])=>{const target=document.querySelector(`#notation-${index}-${direction}`);try{ListeningDeskNotation.render(target,{type:'scale',notes,degreeLabels,singleDirection:true},{width:1700});let initializing=true;const holdAtTonic=()=>{if(initializing)target.scrollLeft=0};target.addEventListener('scroll',holdAtTonic);target.scrollLeft=0;requestAnimationFrame(()=>{target.scrollLeft=0});setTimeout(()=>{initializing=false;target.removeEventListener('scroll',holdAtTonic)},1000)}catch(error){target.textContent='Notation is unavailable in this browser.'}})}
    function keySideMarkup(side,index,kind){const heading=kind==='major'?'Major key':'Relative minor';return `<section class="key-side"><p class="eyebrow">${heading}</p><h3>${side.name}</h3><p class="key-tonic">Tonic: ${side.tonic}</p><div class="key-scale-notation" id="key-scale-${index}-${kind}" aria-label="${side.name} scale"></div><div class="key-controls"><button data-key-side="${index}" data-key-kind="${kind}" data-key-action="scale">▶ Hear scale</button></div></section>`}
    function playKeySide(index, kind){stopRhythmLoop();const side=current().examples[index][kind];sound(side.midis,0,.24)}
    function compareKeyPair(index){stopRhythmLoop();const pair=current().examples[index];sound(pair.major.midis,0,.24);setTimeout(()=>sound(pair.minor.midis,0,.24),2100)}
    function renderKeySignatureLesson(data){$('.compare-head').hidden=true;$('.continue').hidden=true;$('#examples').className='examples';$('#examples').innerHTML=data.examples.map((pair,index)=>`<article class="key-pair"><div class="key-pair-grid">${keySideMarkup(pair.major,index,'major')}${keySideMarkup(pair.minor,index,'minor')}</div><div class="key-bridge">Same key signature · different tonic</div><p class="key-explanation">Same signature and pitch collection; a different tonic creates the major or minor home note.</p><button class="key-compare" data-key-compare="${index}">▶ Compare both</button></article>`).join('')+`<section class="key-reference-wrap"><p class="eyebrow">Grade 5 reference</p><h2>All relative key pairs through six accidentals.</h2><div class="key-reference"><table><thead><tr><th>Key signature</th><th>Major key</th><th>Relative minor</th></tr></thead><tbody>${data.reference.map(row=>`<tr><td>${row.signature}</td><td>${row.major}</td><td>${row.minor}</td></tr>`).join('')}</tbody></table></div></section>`;data.examples.forEach((pair,index)=>['major','minor'].forEach(kind=>{const side=pair[kind],scale=document.querySelector(`#key-scale-${index}-${kind}`);try{ListeningDeskNotation.render(scale,{type:'scale',key:side.keySignature,notes:side.notes,showAccidentals:false},{width:360})}catch(error){scale.textContent='Notation is unavailable in this browser.'}}));$('#examples').querySelectorAll('[data-key-side]').forEach(button=>button.onclick=()=>playKeySide(+button.dataset.keySide,button.dataset.keyKind));$('#examples').querySelectorAll('[data-key-compare]').forEach(button=>button.onclick=()=>compareKeyPair(+button.dataset.keyCompare));if(!(window.AudioContext||window.webkitAudioContext))showAudioFallback()}
    function renderIntervalOverview(){const data=current();$('#crumb').textContent='Intervals';$('#eyebrow').textContent='Grade 5 · Intervals';$('#title').textContent='Learn every simple interval';$('#subtitle').textContent='Choose an interval to see two written examples and hear it in the same listening format.';$('#intro').textContent='Simple intervals fit within an octave. Each lesson shows correct spelling, the number of semitones, and matching notation and sound.';$('#footer').textContent='Grade 5 · Intervals';$('.compare-head').hidden=true;$('.continue').hidden=true;$('#examples').className='examples interval-overview';$('#examples').innerHTML=INTERVAL_LESSONS.map(lesson=>`<a class="interval-link" href="topic.html?topic=intervals&lesson=${lesson.id}"><b>${lesson.label}</b><span>${lesson.semitones} semitone${lesson.semitones===1?'':'s'} · Learn →</span></a>`).join('')}
    function render(){
      if(isIntervalOverview){renderIntervalOverview();return}
      const data=displayedData(),items=data.examples.map((base,index)=>activeExample(index));
      $('.compare-head').hidden=false;$('.continue').hidden=false;$('#crumb').textContent=intervalLesson?'Intervals / '+intervalLesson.label:data.name;$('#eyebrow').textContent='Grade 5 · '+data.name;$('#title').textContent=data.title;$('#subtitle').textContent=data.subtitle;$('#intro').textContent=data.intro;$('#footer').textContent='Grade 5 · '+data.name;if(topic==='key-signatures'){renderKeySignatureLesson(data);return}$('#practice').href='practice.html?topic='+topic;$('#examples').className='examples';
      $('#examples').innerHTML=items.map((item,index)=>`<article class="example"><header><p>Example ${index+1}</p><h3>${item.label}</h3></header>${groupingControls(data.examples[index],item,index)}${topic==='scale-degrees'?scaleDegreeNotation(item,index):`<div class="notation" id="notation-${index}" aria-label="${item.label} notation"></div>`}<div class="example-body"><p>${item.explanation}</p><div class="play-row"><button data-index="${index}" data-part="0">▶ ${item.parts[0][0]}</button><button data-index="${index}" data-part="1">▶ ${item.parts[1][0]}</button><button data-index="${index}" data-part="2">▶ ${topic==='time-signatures'?'Hear multiple bars':'Hear together'}</button></div></div></article>`).join('');
      items.forEach((item,index)=>{if(topic==='scale-degrees'){renderScaleDegreeNotation(item,index);return}const target=document.querySelector(`#notation-${index}`);try{ListeningDeskNotation.render(target,item.notation,{width:760})}catch(error){target.textContent='Notation is unavailable in this browser.'}});
      $('#examples').querySelectorAll('[data-reveal-grouping]').forEach(button=>button.onclick=()=>{const index=+button.dataset.revealGrouping;if(revealedGroupingSelectors.has(index))revealedGroupingSelectors.delete(index);else revealedGroupingSelectors.add(index);render()});$('#examples').querySelectorAll('[data-grouping]').forEach(button=>button.onclick=()=>{stopRhythmLoop();const index=+button.dataset.index;selectedVariants[index]=button.dataset.grouping;revealedGroupingSelectors.add(index);render()});$('#examples').querySelectorAll('[data-part]').forEach(button=>button.onclick=()=>{const index=+button.dataset.index,part=+button.dataset.part;if(part===2&&topic==='time-signatures')toggleRhythmLoop(index,button);else if(part===2){stopRhythmLoop();playExample(index)}else playPart(index,part)});$('#examples').querySelectorAll('[data-scale-start]').forEach(button=>button.onclick=()=>document.getElementById(button.dataset.scaleStart)?.scrollTo({left:0,behavior:'smooth'}));requestAnimationFrame(resetScaleDegreeScroll);setTimeout(resetScaleDegreeScroll,120);setTimeout(resetScaleDegreeScroll,500);if(!(window.AudioContext||window.webkitAudioContext))showAudioFallback()
    }
    if(!isIntervalOverview)$('#compare').onclick=()=>{stopRhythmLoop();playExample(0);setTimeout(()=>playExample(1),topic==='cadences'?2100:['scales','time-signatures'].includes(topic)?2500:1100)};window.addEventListener('pageshow',resetScaleDegreeScroll);window.addEventListener('load',resetScaleDegreeScroll);render();
    startCurrentLesson({grade:5,topicId:topic,lessonId:lessonId||null,statusElement:document.querySelector('[data-lesson-status]'),syncElement:document.querySelector('[data-progress-sync]')});
  </script>
