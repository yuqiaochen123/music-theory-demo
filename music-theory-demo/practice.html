<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Listening Desk · Practice</title><link rel="stylesheet" href="src/journey.css">
  <style>
    .practice-wrap{max-width:920px;margin:0 auto}.session{display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--ink);padding:18px 0}.session strong{color:var(--blue);letter-spacing:.1em;font-size:13px}.session span{font-size:14px;color:var(--muted)}
    .exercise{background:#fff;border:1px solid #b7c9ee;padding:clamp(22px,4vw,42px)}.exercise h2{font-size:29px;margin:0 0 18px}.notation{min-height:230px;display:grid;place-items:center;overflow:hidden;border-block:1px solid #e5ebf7;background:#fff}.notation svg{display:block;width:min(100%,680px);height:auto}body[data-topic="scales"] .notation,body[data-topic="scale-degrees"] .notation{min-height:320px}
    .listen{margin:24px 0;border:0;background:#ffd34e;color:var(--ink);padding:14px 18px;font-weight:800;border-radius:5px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{background:#fff;border:1px solid #9eb7ec;padding:16px;text-align:left;font-weight:800;font-size:17px;cursor:pointer}.answers button:hover{background:#edf3ff}.answers button:disabled{cursor:default;opacity:.68}
    .feedback{margin-top:18px;padding:15px;border-left:4px solid var(--blue);background:#edf3ff;color:var(--ink)}.next{margin-top:14px;border:0;background:var(--blue);color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}
    @media(max-width:560px){.notation{min-height:180px}.answers{grid-template-columns:1fr}.exercise{padding:23px 18px}.practice-wrap h1{font-size:48px}}
  </style>
</head>
<body>
  <header><a class="brand" href="index.html">Listening Desk <span>♪</span></a><nav><a href="grade-5.html">Grade 5</a><a id="lesson-link" href="topic.html?topic=intervals">Lesson</a></nav></header>
  <main class="practice-wrap"><p class="crumb"><a href="index.html">Grades</a> / <a href="grade-5.html">Grade 5</a> / <a id="topic-link" href="topic.html?topic=intervals">Intervals</a> / Practise</p><p class="eyebrow">Listening practice</p><h1 id="page-title">Identify the<br><em>interval.</em></h1><p class="lead" id="lead"></p><p class="progress-sync" data-progress-sync aria-live="polite">Connecting your learning history…</p><section class="session"><strong id="count">Exercise 1 of 10</strong><span id="score">0 correct</span></section><section class="exercise"><h2 id="question"></h2><div class="notation" id="notation" aria-label="Music notation shown on a treble-clef staff"></div><button class="listen" id="play">▶ Play interval</button><div class="answers" id="answers"></div><div class="feedback" id="feedback" hidden></div><button class="next" id="next" hidden>Next exercise →</button></section></main>
  <footer id="footer"></footer>
  <script src="vendor/vexflow-5.0.0.js"></script><script src="vendor/supabase-2.111.0.js"></script><script src="src/notation.js"></script><script src="src/practice-data.js"></script>
  <script>
    const PRACTICE=window.ListeningDeskPractice;let topic=new URLSearchParams(location.search).get('topic');if(!PRACTICE[topic])topic='intervals';document.body.dataset.topic=topic;const labels=PRACTICE[topic];const QUESTIONS=labels.exercises;const cadenceMode=topic==='cadences';labels.topic=labels.name;labels.play=labels.playLabel;labels.footer=`Grade 5 · ${labels.name} practice`;
    let step=0,correct=0,answered=false;const $=selector=>document.querySelector(selector);
    const audioUnavailable='Audio playback is unavailable; you can continue with notation.';
    function playNotes(midis,delay=0,spread=0){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){showAudioFallback();return}const audio=new Audio(),base=audio.currentTime+.03+delay;midis.forEach((midi,index)=>{const start=base+index*spread,oscillator=audio.createOscillator(),gain=audio.createGain();oscillator.type='triangle';oscillator.frequency.value=440*2**((midi-69)/12);oscillator.connect(gain).connect(audio.destination);gain.gain.setValueAtTime(.001,start);gain.gain.exponentialRampToValueAtTime(.16,start+.03);gain.gain.exponentialRampToValueAtTime(.001,start+.55);oscillator.start(start);oscillator.stop(start+.57)})}
    function showAudioFallback(){const feedback=$('#feedback');feedback.hidden=false;feedback.textContent=audioUnavailable;$('#play').disabled=true}
    function playQuestion(question){if(cadenceMode){playNotes(question.audio[0]);playNotes(question.audio[1],.9)}else if(['scales','scale-degrees'].includes(topic))playNotes(question.midis.concat(question.descendingMidis.slice(1)),0,.24);else if(topic==='time-signatures')playNotes(question.midis,0,.22);else playNotes(question.midis)}
    function draw(question){let specification;if(cadenceMode)specification={type:'cadence',key:question.key,chords:question.chords};else if(topic==='triads')specification={type:'triad',key:question.key,notes:question.notes,showAccidentals:!question.key};else if(topic==='time-signatures')specification={type:'rhythm',meter:question.meter,events:question.events};else if(['scales','scale-degrees'].includes(topic))specification={type:'scale',notes:question.notes,descendingNotes:question.descendingNotes};else specification={type:'interval',notes:question.notes};const target=$('#notation');try{ListeningDeskNotation.render(target,specification,{width:820})}catch(error){target.textContent='Notation is unavailable in this browser.'}}
    function render(){const question=QUESTIONS[step];answered=false;$('#count').textContent=`Exercise ${step+1} of ${QUESTIONS.length}`;$('#score').textContent=`${correct} correct`;$('#question').textContent=question.prompt||labels.question;draw(question);$('#feedback').hidden=true;$('#next').hidden=true;const choices=question.choices?question.choices.map(choice=>[choice,choice]):labels.answers;$('#answers').innerHTML=choices.map(([value,text])=>`<button data-answer="${value}">${text}</button>`).join('');document.querySelectorAll('[data-answer]').forEach(button=>button.onclick=()=>answer(button.dataset.answer))}
    async function answer(value){if(answered)return;answered=true;const ok=value===QUESTIONS[step].answer;if(ok)correct++;const feedback=$('#feedback');feedback.hidden=false;feedback.innerHTML=ok?'<strong>Correct.</strong> Keep connecting the sound with the notation.':'<strong>Not quite.</strong> Replay it and follow the movement between the notes.';document.querySelectorAll('[data-answer]').forEach(button=>button.disabled=true);$('#next').hidden=false;$('#score').textContent=`${correct} correct`;await window.ListeningDeskProgress?.recordAnswer({grade:5,topicId:topic,lessonId:null,exerciseId:QUESTIONS[step].id??`${topic}-${step+1}`,answerGiven:value,correctAnswer:QUESTIONS[step].answer,isCorrect:ok,correctCount:correct,exerciseNumber:step+1,totalExercises:QUESTIONS.length,syncElement:document.querySelector('[data-progress-sync]')})}
    $('#play').onclick=()=>playQuestion(QUESTIONS[step]);$('#next').onclick=()=>{if(step<QUESTIONS.length-1){step++;render()}else{$('#feedback').hidden=false;$('#feedback').innerHTML=`<strong>Session complete.</strong> You identified ${correct} out of ${QUESTIONS.length} examples. <a href="topic.html?topic=${topic}">Return to the lesson</a>`;$('#next').hidden=true}};
    $('#topic-link').textContent=labels.topic;$('#topic-link').href=`topic.html?topic=${topic}`;$('#lesson-link').href=$('#topic-link').href;$('#page-title').innerHTML=labels.title;$('#lead').textContent=labels.lead;$('#question').textContent=labels.question;$('#play').textContent=labels.play;$('#footer').textContent=labels.footer;render();if(!(window.AudioContext||window.webkitAudioContext))showAudioFallback();
  </script>
  <script type="module">
    import { installPracticeProgress, startCurrentLesson } from './src/progress-page.js';
    installPracticeProgress();
    const topicId=new URLSearchParams(location.search).get('topic')||'intervals';
    startCurrentLesson({grade:5,topicId,lessonId:null,syncElement:document.querySelector('[data-progress-sync]')});
  </script>
</body>
</html>
